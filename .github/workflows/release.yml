# The release APK on GitHub (the pipeline is Trueform's, without its native build). Every push to main (and a run by
# hand) runs the unit tests, builds the signed release and publishes it as a GitHub release: tag build-<commit count>,
# the APK as skyform.apk (so releases/latest/download/skyform.apk is always the newest), its SHA-256 and R8's mapping.
# Without the signing secrets (scripts\release-key.ps1) nothing is published: the in-app updater cannot install an APK
# signed with another key, so such a build only stays with the run for a week.
name: Release APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write  # (the release and its tag)

defaults:
  run:
    shell: bash

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out (the whole history; the commit count is the build number)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK packages (platform 37.2)
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-37.2" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: bash ./gradlew --no-daemon --console=plain :app:testDebugUnitTest

      - name: Build the release APK
        env:
          SF_KEYSTORE_BASE64: ${{ secrets.SF_KEYSTORE_BASE64 }}
          SF_KEYSTORE_PASSWORD: ${{ secrets.SF_KEYSTORE_PASSWORD }}
          SF_KEY_ALIAS: ${{ secrets.SF_KEY_ALIAS }}
          SF_KEY_PASSWORD: ${{ secrets.SF_KEY_PASSWORD }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/release.keystore"' EXIT
          if [ -n "$SF_KEYSTORE_BASE64" ]; then
            printf '%s' "$SF_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export SF_KEYSTORE="$RUNNER_TEMP/release.keystore"
            echo "SF_SIGNED=secrets" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets: this build is debug-signed and will not be published (scripts/release-key.ps1)"
            echo "SF_SIGNED=none" >> "$GITHUB_ENV"
          fi
          unset SF_KEYSTORE_BASE64
          export SF_BUILD_NUMBER=$(git rev-list --count HEAD)
          export SF_COMMIT=$(git rev-parse --short=7 HEAD)
          bash ./gradlew --no-daemon --console=plain :app:assembleRelease

      - name: Package (the APK, its SHA-256, the mapping) and write the notes
        id: pkg
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          count=$(git rev-list --count HEAD)
          short=$(git rev-parse --short=7 HEAD)
          version=$(sed -n 's/^ *versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          tag="build-$count"
          mkdir -p out
          cp "$apk" out/skyform.apk
          (cd out && sha256sum skyform.apk > skyform.apk.sha256)
          cp app/build/outputs/mapping/release/mapping.txt out/mapping.txt
          bt=$(ls -d "$ANDROID_HOME"/build-tools/[0-9]* | sort -V | tail -n 1)
          certs=$("$bt/apksigner" verify --print-certs -v out/skyform.apk 2>&1)
          printf '%s\n' "$certs" | grep -iE 'verified|signer|warning|error' || true
          digest=$(printf '%s\n' "$certs" | grep -m 1 'certificate SHA-256 digest: ' | sed 's/.*SHA-256 digest: //' || true)
          prev=$(git tag --list 'build-*' --sort=-version:refname | grep -vx "$tag" | head -n 1 || true)
          {
            echo "Skyform $version, build $count: commit \`$short\`, built $(date -u '+%Y-%m-%d %H:%M') UTC."
            echo
            echo "**Install:** on the phone, download \`skyform.apk\` and open it (Android asks once to allow installs from the browser). Android 10 or later. Installed copies update themselves from the app."
            echo
            echo "**Signing certificate SHA-256:** \`$digest\`"
            echo
            if [ -n "$prev" ] && git merge-base --is-ancestor "$prev" HEAD; then
              echo "**Changes since $prev:**"
              git log --no-merges --format='- %s (%h)' -n 40 "$prev..HEAD"
            else
              echo "**Latest changes:**"
              git log --no-merges --format='- %s (%h)' -n 15
            fi
          } > "$RUNNER_TEMP/notes.md"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=Skyform $version build $count" >> "$GITHUB_OUTPUT"
          echo "### Skyform $version build $count ($short) · APK $(stat -c %s out/skyform.apk) bytes · signed: $SF_SIGNED" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release (main, signed)
        if: github.ref == 'refs/heads/main' && env.SF_SIGNED == 'secrets'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.pkg.outputs.tag }}
          TITLE: ${{ steps.pkg.outputs.title }}
        run: |
          assets=(out/skyform.apk out/skyform.apk.sha256 out/mapping.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$RUNNER_TEMP/notes.md" --latest
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "$TITLE" \
              --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi

      - name: Keep the APK with the run (not published)
        if: github.ref != 'refs/heads/main' || env.SF_SIGNED != 'secrets'
        uses: actions/upload-artifact@v7
        with:
          name: skyform-${{ steps.pkg.outputs.tag }}
          path: out/skyform.apk
          retention-days: 7
